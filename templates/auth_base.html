{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cabinet Médical{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Inter', sans-serif; }
        html, body { height: 100%; margin: 0; padding: 0; }

        body {
            background: linear-gradient(135deg, #1a2a3a 0%, #0d6efd 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;      /* centré sur desktop */
            justify-content: center;
            padding: 20px;
            overflow-y: auto;         /* ← permet le scroll si trop long */
        }

        .auth-card {
            width: 450px;
            max-width: 100%;
            flex-shrink: 0;
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            background: white;
            overflow: hidden;
            margin: auto;             /* ← centre même si trop grand */
        }

        .auth-card .card-body { padding: 40px 30px; }

        .auth-header {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }
        .auth-header i { font-size: 2.5rem; }
        .auth-header h2 { font-size: 1.5rem; font-weight: 700; margin: 10px 0 5px 0; }
        .auth-header p { margin: 0; opacity: 0.9; font-size: 0.9rem; }

        .form-label { font-weight: 500; color: #333; font-size: 0.9rem; }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #dee2e6;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(13,110,253,0.3);
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #6c757d;
        }
        .auth-footer a { color: #0d6efd; text-decoration: none; font-weight: 500; }

        /* ===== MOBILE : plein écran, scrollable ===== */
        @media (max-width: 767px) {
            body {
                padding: 0;
                align-items: flex-start;   /* ← NE PAS centrer verticalement */
                background: white;
                display: block;            /* ← plus de flex sur mobile */
                min-height: auto;
                overflow-y: auto;
            }

            .auth-card {
                width: 100%;
                max-width: 100%;
                min-height: 100vh;
                min-height: 100dvh;
                border-radius: 0;
                box-shadow: none;
                margin: 0;
                display: flex;
                flex-direction: column;
            }

            .auth-card .card-body {
                padding: 25px 20px 40px 20px;
                flex: 1;
                /* PAS de justify-content: center ici → le contenu défile naturellement */
            }

            .auth-header {
                padding: 40px 20px 30px 20px;
            }

            .form-control {
                padding: 14px 15px;
                font-size: 1rem;
            }
            .btn-primary {
                padding: 14px;
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <div class="card auth-card">
        <div class="auth-header">
            <i class="bi bi-hospital"></i>
            <h2>{% block header_title %}Cabinet Médical{% endblock %}</h2>
            <p>{% block subtitle %}Gestion complète{% endblock %}</p>
        </div>

        <div class="card-body">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
