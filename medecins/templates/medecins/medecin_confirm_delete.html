{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Confirmer la suppression </h4>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">Etes-vous sûr de supprimer?</p>
                <p class="fw-bold text-danger">{{ medecin.nom }} {{ medecin.prenom }}</p>
                <p class="text-muted">Specialty: {{ medecin.specialite }}</p>
                <hr>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Oui
                        </button>
                        <a href="{% url 'medecins:medecin_list' %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Retour
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
